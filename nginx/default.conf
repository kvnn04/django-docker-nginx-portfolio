# --- CONFIGURACIÓN GLOBAL DE SEGURIDAD Y LIMITACIÓN ---
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=1r/s;
limit_req_status 429;
server_tokens off;

upstream repo_app {
    server portfolio:8000;
}

# 1. BLOQUE PRINCIPAL (HTTPS - kevinntech.com)
server {
    listen 443 ssl default_server;
    server_name kevinntech.com;

    # --- CERTIFICADOS SSL ---
    ssl_certificate /etc/letsencrypt/live/kevinntech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kevinntech.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/kevinntech.com/fullchain.pem;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- SEGURIDAD POST-CUÁNTICA Y PROTOCOLOS ---
    ssl_ecdh_curve auto;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_prefer_server_ciphers on;

    # --- OPTIMIZACIÓN Y SESIÓN ---
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # --- OCSP STAPLING ---
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 169.254.169.253 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # --- CABECERAS DE SEGURIDAD (MÁXIMO NIVEL) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-XSS-Protection "0";

    # CSP Estricta (Bloquea todo por defecto)
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    # --- TIMEOUTS DE CONEXIÓN ---
    client_max_body_size 10M;
    client_body_timeout 12s;
    client_header_timeout 12s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # --- FILTROS DE SEGURIDAD (ANTI-BOTS Y EXPLOITS) ---
    location ~* \.(php|cgi|sh|bash|env|git|exe|jsp|asp|aspx|sql|bak|old|swp|log|rar|zip|gz|7z)$ {
        access_log off;
        log_not_found off;
        return 444;
    }

    location ~* /(cgi-bin|wp-admin|wp-content|wp-includes|xmlrpc\.php|config|backup|admin|db|setup|cloud|temp) {
        access_log off;
        log_not_found off;
        return 444;
    }

    # --- PROXY PARA DJANGO ---
    location / {
        # Protección contra Inyección de Parámetros y SSRF
        if ($query_string ~* "(\.\./|etc/passwd|printenv|/root/|\.env|metadata|169\.254\.169\.254|wget|curl|chmod|bin/sh|bin/bash|base64)") {
            return 403;
        }

        if ($request_method !~ ^(GET|HEAD|POST)$ ) {
            return 405;
        }

        limit_req zone=mylimit burst=5 nodelay;
        proxy_pass http://repo_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- ARCHIVOS ESTÁTICOS ---
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }
}

# 2. REDIRECCIÓN HTTP A HTTPS
server {
    listen 80;
    server_name kevinntech.com;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Mantenemos tus filtros en el puerto 80
    if ($query_string ~* "(\.\./|etc/passwd|printenv|/root/|\.env|metadata|169\.254\.169\.254|wget|curl|chmod|bin/sh|bin/bash|base64)") {
        return 403;
    }

    location ~* \.(php|cgi|sh|bash|env|git|exe|jsp|asp|aspx|sql|bak|old|swp|log|rar|zip|gz|7z)$ {
        access_log off;
        log_not_found off;
        return 444;
    }

    location / {
        return 301 https://kevinntech.com$request_uri;
    }
}
